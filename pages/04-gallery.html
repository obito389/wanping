  <!--
    已填充 9 个条目（8 张照片 + 1 段情景剧视频，压缩版在 assets/img 与 assets/video/）。
    待办：法皓扬精选素材到手后补充；照片说明文字向实地同学核实后可再细化。

  <section class="section">
    <div class="container">
      <h2 class="section-title">影像集</h2>
      <p class="section-subtitle">照片与视频</p>

      <div class="gallery-filter">
        <button class="active" data-cat="all">全部</button>
        <button data-cat="museum">抗战馆</button>
        <button data-cat="city">宛平城</button>
        <button data-cat="show">情景剧</button>
      </div>

      <div class="gallery-grid">
        <!-- 抗战馆 -->
        <figure class="gallery-item" data-cat="museum">
          <img src="../assets/img/museum-led.jpg" alt="抗战馆序厅 LED 主题屏" loading="lazy" />
          <figcaption>中国人民抗日战争纪念馆 · LED 主题屏「铭记历史 缅怀先烈 珍爱和平 开创未来」</figcaption>
        </figure>
        <figure class="gallery-item" data-cat="museum">
          <img src="../assets/img/museum-datawall.jpg" alt="抗战伤亡损失立体数字墙" loading="lazy" />
          <figcaption>中国人民抗日战争纪念馆 · 伤亡损失立体数字墙</figcaption>
        </figure>
        <figure class="gallery-item" data-cat="museum">
          <img src="../assets/img/museum-nanniwan.jpg" alt="南泥湾精神电子屏与展板" loading="lazy" />
          <figcaption>中国人民抗日战争纪念馆 · 南泥湾精神电子屏</figcaption>
        </figure>
        <figure class="gallery-item" data-cat="museum">
          <img src="../assets/img/museum-langya.jpg" alt="狼牙山五壮士雕塑场景" loading="lazy" />
          <figcaption>中国人民抗日战争纪念馆 · 狼牙山五壮士雕塑场景</figcaption>
        </figure>

        <!-- 宛平城 · 卢沟桥 -->
        <figure class="gallery-item" data-cat="city">
          <img src="../assets/img/city-gate.jpg" alt="宛平城威严门" loading="lazy" />
          <figcaption>宛平城 · 威严门</figcaption>
        </figure>
        <figure class="gallery-item" data-cat="city">
          <img src="../assets/img/city-map.jpg" alt="宛平思政月点位地图与研学小程序码" loading="lazy" />
          <figcaption>宛平城 ·「宛平思政月」点位地图与研学小程序</figcaption>
        </figure>
        <figure class="gallery-item" data-cat="city">
          <img src="../assets/img/lugou-bridge.jpg" alt="卢沟桥桥面石板路与石狮望柱" loading="lazy" />
          <figcaption>卢沟桥 · 桥面石板路与石狮望柱</figcaption>
        </figure>
        <figure class="gallery-item" data-cat="city">
          <img src="../assets/img/lugou-lion.jpg" alt="卢沟桥石狮特写" loading="lazy" />
          <figcaption>卢沟桥 · 石狮特写（背景为永定河）</figcaption>
        </figure>

        <!-- 情景剧 -->
        <figure class="gallery-item" data-cat="show">
          <video src="../assets/video/theater-show.mp4" controls preload="metadata"></video>
          <figcaption>永定小剧场 · 沉浸式情景剧（LED 大屏卢沟桥画面背景）</figcaption>
        </figure>
      </div>
    </div>
