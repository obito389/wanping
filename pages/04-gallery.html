    1) 精选照片放 assets/img/，视频放 assets/video/（注意压缩，每个视频建议 < 20MB）
    2) 每个 gallery-item 加 data-cat="museum|city|show" 即可被筛选按钮过滤
    3) figcaption 写一句话说明（时间地点需向实地同学核实）
    4) 法皓扬精选素材到手后再补充
    下面给两个示例条目，明天照着复制即可。

    <div class="container">
      <h2 class="section-title">影像集</h2>
      <p class="section-subtitle">照片与视频</p>

      <div class="gallery-filter">
        <button class="active" data-cat="all">全部</button>
        <button data-cat="museum">抗战馆</button>
        <button data-cat="city">宛平城</button>
        <button data-cat="show">情景剧</button>
